name: CI

# Verificação obrigatória (PLANO.md): lint + typecheck + test + build.
# Roda em todo push na main e em todo pull request.
on:
  push:
    branches: [main]
  pull_request:

# Cancela execuções antigas do mesmo PR/branch para economizar minutos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários
        run: npm run test

      - name: Build
        # Placeholders só para o build não falhar por env ausente.
        # NÃO são segredos — são valores fictícios de compilação.
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_UNISANTA_EMAIL_DOMAIN: unisanta.br
        run: npm run build
